<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Kalkulator Funnel & Budget</title>
<meta name="theme-color" content="#6366F1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalkulator Funnel">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F7FC;--card:#FFFFFF;--card2:#F3F1FF;--bdr:#ECEAF8;
  --txt:#161A2B;--txt2:#484D64;--mut:#8B8FA3;
  --pri:#6366F1;--pri2:#8B5CF6;--pri-d:#4F46E5;--pri-l:#EEF0FF;
  --grn:#10B981;--grn-l:#ECFDF5;
  --amb:#F59E0B;--amb-l:#FFFBEB;
  --red:#F43F5E;--red-l:#FFF1F3;
  --shd:0 4px 20px rgba(99,102,241,.08);
  --shd-lg:0 8px 28px rgba(99,102,241,.14);
  --font:'Poppins',-apple-system,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
input,select,button{font-family:var(--font)}

.topbar{background:linear-gradient(120deg,var(--pri),var(--pri2));padding:20px 18px 22px;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(99,102,241,.25)}
.tb-title{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.01em}
.tb-sub{font-size:10.5px;color:rgba(255,255,255,.8);margin-top:2px;font-weight:500}

.wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px}

.tabs{display:flex;gap:7px;margin-bottom:18px;background:var(--card);padding:6px;border-radius:18px;box-shadow:var(--shd)}
.tab-btn{flex:1;padding:11px 6px;border-radius:13px;background:transparent;border:none;font-size:10px;font-weight:700;color:var(--mut);text-align:center;cursor:pointer;line-height:1.4;transition:all .2s}
.tab-btn.active{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.35)}

.tab-panel{display:none}
.tab-panel.active{display:block}

.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--shd);border:1px solid var(--bdr);margin-bottom:14px}
.card-title{font-size:14px;font-weight:800;color:var(--txt);margin-bottom:5px;letter-spacing:-.01em}
.card-desc{font-size:11px;color:var(--mut);margin-bottom:18px;line-height:1.65}

.form-row{margin-bottom:15px}
.form-row label{display:block;font-size:11.5px;font-weight:700;color:var(--txt2);margin-bottom:7px}
.form-row input,.form-row select{width:100%;padding:13px 15px;border:1.5px solid var(--bdr);border-radius:13px;font-size:14px;color:var(--txt);background:var(--bg);outline:none;transition:border-color .2s}
.form-row input:focus,.form-row select:focus{border-color:var(--pri);background:#fff}

.btn{padding:15px 20px;border-radius:14px;border:none;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;width:100%;transition:transform .15s}
.btn-primary{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.3)}
.btn-primary:active{transform:scale(.98)}

.result-box{background:var(--card2);border-radius:18px;padding:18px;margin-top:18px;display:none}
.result-box.show{display:block}
.result-hero{text-align:center;padding:18px 16px 22px;border-radius:16px;margin-bottom:16px;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 8px 20px rgba(99,102,241,.25)}
.result-hero .lbl{font-size:10.5px;color:rgba(255,255,255,.8);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.result-hero .val{font-size:27px;font-weight:800;color:#fff;margin-top:5px;letter-spacing:-.01em}
.result-hero .sub{font-size:11px;color:rgba(255,255,255,.85);margin-top:5px;font-weight:500}

.funnel-step{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--card);border-radius:12px;margin-bottom:7px}
.funnel-step:last-child{margin-bottom:0}
.funnel-step .step-lbl{font-size:11.5px;color:var(--txt2);font-weight:600}
.funnel-step .step-rate{font-size:9px;color:var(--mut);font-weight:400;display:block;margin-top:1px}
.funnel-step .step-val{font-size:13px;color:var(--pri-d);font-weight:800}

.rate-note{font-size:9.5px;color:var(--mut);margin-top:12px;line-height:1.65;background:var(--card);border-radius:12px;padding:11px 13px}

.compare-row{padding:12px 14px;background:var(--card);border-radius:14px;margin-bottom:8px}
.compare-row:last-child{margin-bottom:0}
.compare-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.compare-lbl{font-size:11.5px;font-weight:700;color:var(--txt2)}
.compare-badge{font-size:9px;font-weight:800;padding:3px 9px;border-radius:20px}
.compare-badge.good{background:var(--grn-l);color:var(--grn)}
.compare-badge.warn{background:var(--amb-l);color:var(--amb)}
.compare-badge.bad{background:var(--red-l);color:var(--red)}
.compare-nums{font-size:10px;color:var(--mut)}
.compare-nums b{color:var(--txt)}
.leak-box{background:linear-gradient(135deg,var(--red),#FB7185);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 6px 16px rgba(244,63,94,.25)}
.leak-box .leak-title{font-size:12.5px;font-weight:800;color:#fff;margin-bottom:5px}
.leak-box .leak-body{font-size:11px;color:rgba(255,255,255,.92);line-height:1.65}

.loading{text-align:center;padding:50px 20px;color:var(--mut);font-size:12px}
.err-box{text-align:center;padding:30px 20px;color:var(--red);font-size:11.5px;line-height:1.6;background:var(--red-l);border-radius:16px;margin:0 4px}
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-title">🧮 Kalkulator Funnel & Budget</div>
  <div class="tb-sub">Berdasarkan Pipeline Marketing — rate live dari sheet</div>
</header>

<div class="wrap">
  <div id="content">
    <div class="loading">⏳ Mengambil rate konversi dari sheet...</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// SUMBER DATA — Pipeline Marketing sheet
// ══════════════════════════════════════════════════════
const SHEET_ID = '1yVP3lGxCx88FDI5fgXQHdXF1G0gWldsSs7fT7RKDNPg';
const GID = 0;

function fmt(n){ return 'Rp ' + Math.round(n||0).toLocaleString('id-ID'); }
function fmtNum(n){ return Math.round(n||0).toLocaleString('id-ID'); }
function parseNumStr(s){
  if(typeof s==='number') return s;
  var clean=String(s||'').replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(',','.');
  return parseFloat(clean)||0;
}

function gviz(){
  var url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?gid='+GID+'&tqx=out:json&range=A1:P12';
  return fetch(url).then(function(r){return r.text();}).then(function(txt){
    var json=JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}')+1));
    return json.table;
  });
}

function parseTable(table){
  var rows=table.rows.map(function(row){
    return (row.c||[]).map(function(cell){
      return cell && cell.v!==null && cell.v!==undefined ? cell.v : '';
    });
  });
  return rows;
}

// ══════════════════════════════════════════════════════
// TURUNIN RATE DARI ANGKA MENTAH (bukan dari teks label) —
// biar gak kesandung typo label kayak sebelumnya. Posisi kolom:
// A=Channel,B=HariAktif,C=OmzetPerusahaan,D=%,E=OmzetChannel,
// F=RataNilaiProyek,G=ClosingDeal,H=ClosingSurvey,I=LeadsMasuk/Respon,
// J=KlikCTA/LeadsFU,K=LPView/FUPerHari,L=Klik-CTR,M=Impression,
// N=CPM,O=Budget,P=BudgetHarian
// ══════════════════════════════════════════════════════
var RATES = null;

function findRowByChannel(rows, keyword){
  // GViz suka "loncatin" baris kosong, jadi index array BUKAN patokan
  // yang bisa dipercaya buat nomor baris di sheet aslinya (udah
  // berkali-kali kejadian di app lain). Jadi dicari dari ISI kolom A
  // (nama channel), bukan posisi tetap.
  for(var i=0;i<rows.length;i++){
    var label = String(rows[i][0]||'').toLowerCase().trim();
    if(label.includes(keyword)) return rows[i];
  }
  return null;
}

function deriveRates(rows){
  function col(row,i){ return row ? parseNumStr(row[i]) : 0; }

  var metaRow = findRowByChannel(rows, 'meta ads');
  var dbRow = findRowByChannel(rows, 'follow up database');
  var repRow = findRowByChannel(rows, 'repeat');

  console.log('[Pipeline Marketing] Baris ditemukan — Meta Ads:', metaRow, '| FU Database:', dbRow, '| Repeat:', repRow);

  if(!metaRow || !dbRow || !repRow){
    throw new Error('Gak nemu baris channel yang dicari di sheet (Meta Ads/Follow Up Database/Repeat). Cek apakah nama channel di kolom A masih sama persis.');
  }

  var meta = {
    hariAktif: col(metaRow,1),
    rataNilaiProyek: col(metaRow,5),
    rateDealSurvey: col(metaRow,6)/col(metaRow,7),       // G/H
    rateSurveyLeads: col(metaRow,7)/col(metaRow,8),      // H/I
    rateLeadsKlikCta: col(metaRow,8)/col(metaRow,9),     // I/J
    rateKlikCtaLpView: col(metaRow,9)/col(metaRow,10),   // J/K
    rateLpViewKlikCtr: col(metaRow,10)/col(metaRow,11),  // K/L
    rateKlikCtrImpression: col(metaRow,11)/col(metaRow,12), // L/M
    cpm: col(metaRow,13),
  };

  function parseFU(row){
    return {
      hariAktif: col(row,1),
      rataNilaiProyek: col(row,5),
      rateDealSurvey: col(row,6)/col(row,7),      // G/H
      rateSurveyLeadsRespon: col(row,7)/col(row,8), // H/I
      rateLeadsResponLeadsFu: col(row,8)/col(row,9), // I/J
    };
  }

  return {
    meta: meta,
    database: parseFU(dbRow),
    repeat: parseFU(repRow),
  };
}

// ══════════════════════════════════════════════════════
// KALKULATOR A — Omzet Target → Budget (mundur dari Deal ke Impression)
// ══════════════════════════════════════════════════════
function calcA(omzetTarget){
  var m = RATES.meta;
  var deal = omzetTarget / m.rataNilaiProyek;
  var survey = deal / m.rateDealSurvey;
  var leads = survey / m.rateSurveyLeads;
  var klikCta = leads / m.rateLeadsKlikCta;
  var lpView = klikCta / m.rateKlikCtaLpView;
  var klikCtr = lpView / m.rateLpViewKlikCtr;
  var impression = klikCtr / m.rateKlikCtrImpression;
  var budgetTotal = impression * m.cpm / 1000;
  var budgetHarian = budgetTotal / m.hariAktif;
  return {deal,survey,leads,klikCta,lpView,klikCtr,impression,budgetTotal,budgetHarian};
}

// ══════════════════════════════════════════════════════
// KALKULATOR B — Budget Total → Omzet Potensial (maju dari Impression ke Deal)
// ══════════════════════════════════════════════════════
function calcB(budgetTotal){
  var m = RATES.meta;
  var impression = budgetTotal / m.cpm * 1000;
  var klikCtr = impression * m.rateKlikCtrImpression;
  var lpView = klikCtr * m.rateLpViewKlikCtr;
  var klikCta = lpView * m.rateKlikCtaLpView;
  var leads = klikCta * m.rateLeadsKlikCta;
  var survey = leads * m.rateSurveyLeads;
  var deal = survey * m.rateDealSurvey;
  var omzet = deal * m.rataNilaiProyek;
  var budgetHarian = budgetTotal / m.hariAktif;
  return {impression,klikCtr,lpView,klikCta,leads,survey,deal,omzet,budgetHarian};
}

// ══════════════════════════════════════════════════════
// KALKULATOR C — Jumlah Leads (Database/Repeat) → Omzet Potensial
// ══════════════════════════════════════════════════════
function calcC(jumlahLeads, tipe){
  var r = tipe==='repeat' ? RATES.repeat : RATES.database;
  var leadsRespon = jumlahLeads * r.rateLeadsResponLeadsFu;
  var survey = leadsRespon * r.rateSurveyLeadsRespon;
  var deal = survey * r.rateDealSurvey;
  var omzet = deal * r.rataNilaiProyek;
  return {leadsRespon,survey,deal,omzet};
}

// ══════════════════════════════════════════════════════
// RENDER UI
// ══════════════════════════════════════════════════════
function renderApp(){
  document.getElementById('content').innerHTML = `
    <div class="tabs">
      <div class="tab-btn active" data-tab="a" onclick="switchTab('a')">🎯 Omzet<br>→ Budget</div>
      <div class="tab-btn" data-tab="b" onclick="switchTab('b')">💰 Budget<br>→ Omzet</div>
      <div class="tab-btn" data-tab="c" onclick="switchTab('c')">📇 Leads<br>→ Omzet</div>
      <div class="tab-btn" data-tab="d" onclick="switchTab('d')">🔍 Kontrol<br>Aktual</div>
    </div>

    <div class="tab-panel active" data-panel="a">
      <div class="card">
        <div class="card-title">Target Omzet → Budget yang Dibutuhin</div>
        <div class="card-desc">Mau dapet omzet sekian, butuh budget iklan Meta Ads berapa? Lengkap sama breakdown funnel-nya.</div>
        <div class="form-row">
          <label>Target Omzet (Rp)</label>
          <input type="text" inputmode="numeric" id="input-a" placeholder="150.000.000" oninput="formatRupiah(this)">
        </div>
        <button class="btn btn-primary" onclick="runCalcA()">Hitung Budget</button>
        <div class="result-box" id="result-a"></div>
      </div>
    </div>

    <div class="tab-panel" data-panel="b">
      <div class="card">
        <div class="card-title">Budget Total → Omzet Potensial</div>
        <div class="card-desc">Punya budget sekian buat Meta Ads, idealnya bisa ngasilin omzet berapa?</div>
        <div class="form-row">
          <label>Budget Total (Rp)</label>
          <input type="text" inputmode="numeric" id="input-b" placeholder="10.000.000" oninput="formatRupiah(this)">
        </div>
        <button class="btn btn-primary" onclick="runCalcB()">Hitung Omzet Potensial</button>
        <div class="result-box" id="result-b"></div>
      </div>
    </div>

    <div class="tab-panel" data-panel="c">
      <div class="card">
        <div class="card-title">Leads yang Ada → Omzet Potensial</div>
        <div class="card-desc">Punya database/repeat customer sekian, bisa dilikuidasi jadi omzet berapa?</div>
        <div class="form-row">
          <label>Jumlah Leads</label>
          <input type="number" inputmode="numeric" min="0" id="input-c" placeholder="200">
        </div>
        <div class="form-row">
          <label>Tipe Leads</label>
          <select id="input-c-tipe">
            <option value="database">Follow Up Database (rate lebih rendah)</option>
            <option value="repeat">Repeat Customer (rate lebih tinggi)</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="runCalcC()">Hitung Omzet Potensial</button>
        <div class="result-box" id="result-c"></div>
      </div>
    </div>

    <div class="tab-panel" data-panel="d">
      <div class="card">
        <div class="card-title">Kontrol Aktual — Rencana vs Kenyataan</div>
        <div class="card-desc">Isi angka AKTUAL hasil campaign (periode bebas, gak perlu per-hari). App bandingin tiap tahap ke rate IDEAL dari Pipeline Marketing, kasih tau tahap mana yang paling "bocor".</div>
        <div class="form-row"><label>Impression</label><input type="number" inputmode="numeric" min="0" id="input-d-impression" placeholder="0"></div>
        <div class="form-row"><label>Klik / CTR</label><input type="number" inputmode="numeric" min="0" id="input-d-klikctr" placeholder="0"></div>
        <div class="form-row"><label>LP View</label><input type="number" inputmode="numeric" min="0" id="input-d-lpview" placeholder="0"></div>
        <div class="form-row"><label>Klik CTA</label><input type="number" inputmode="numeric" min="0" id="input-d-klikcta" placeholder="0"></div>
        <div class="form-row"><label>Leads Masuk</label><input type="number" inputmode="numeric" min="0" id="input-d-leads" placeholder="0"></div>
        <div class="form-row"><label>Closing Survey</label><input type="number" inputmode="numeric" min="0" id="input-d-survey" placeholder="0"></div>
        <div class="form-row"><label>Closing Deal</label><input type="number" inputmode="numeric" min="0" id="input-d-deal" placeholder="0"></div>
        <button class="btn btn-primary" onclick="runCalcD()">Analisa</button>
        <div class="result-box" id="result-d"></div>
      </div>
    </div>
  `;
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(function(el){
    el.classList.toggle('active', el.dataset.tab===tab);
  });
  document.querySelectorAll('.tab-panel').forEach(function(el){
    el.classList.toggle('active', el.dataset.panel===tab);
  });
}

function formatRupiah(el){
  const raw=el.value.replace(/\D/g,'');
  el.value=raw?Number(raw).toLocaleString('id-ID'):'';
}
function numRupiah(id){
  const raw=document.getElementById(id).value.replace(/\D/g,'');
  return raw?+raw:0;
}

function pct1(r){ return (r*100).toFixed(1)+'%'; }

function funnelStepsHTML(r){
  const m = RATES.meta;
  return `
    <div class="funnel-step"><span class="step-lbl">Impression</span><span class="step-val">${fmtNum(r.impression)}</span></div>
    <div class="funnel-step"><span class="step-lbl">Klik / CTR <span class="step-rate">(${pct1(m.rateKlikCtrImpression)} dari Impression)</span></span><span class="step-val">${fmtNum(r.klikCtr)}</span></div>
    <div class="funnel-step"><span class="step-lbl">LP View <span class="step-rate">(${pct1(m.rateLpViewKlikCtr)} dari Klik/CTR)</span></span><span class="step-val">${fmtNum(r.lpView)}</span></div>
    <div class="funnel-step"><span class="step-lbl">Klik CTA <span class="step-rate">(${pct1(m.rateKlikCtaLpView)} dari LP View)</span></span><span class="step-val">${fmtNum(r.klikCta)}</span></div>
    <div class="funnel-step"><span class="step-lbl">Leads Masuk <span class="step-rate">(${pct1(m.rateLeadsKlikCta)} dari Klik CTA)</span></span><span class="step-val">${fmtNum(r.leads)}</span></div>
    <div class="funnel-step"><span class="step-lbl">Closing Survey <span class="step-rate">(${pct1(m.rateSurveyLeads)} dari Leads)</span></span><span class="step-val">${fmtNum(r.survey)}</span></div>
    <div class="funnel-step"><span class="step-lbl">Closing Deal <span class="step-rate">(${pct1(m.rateDealSurvey)} dari Survey)</span></span><span class="step-val">${fmtNum(r.deal)}</span></div>
  `;
}

function runCalcA(){
  const omzet = numRupiah('input-a');
  if(omzet<=0){ return; }
  const r = calcA(omzet);
  document.getElementById('result-a').innerHTML = `
    <div class="result-hero">
      <div class="lbl">Budget Total Dibutuhin</div>
      <div class="val">${fmt(r.budgetTotal)}</div>
      <div class="sub">${fmt(r.budgetHarian)} / hari · ${RATES.meta.hariAktif} hari aktif</div>
    </div>
    ${funnelStepsHTML(r)}
    <div class="rate-note">CPM (biaya per 1000 Impression): ${fmt(RATES.meta.cpm)}. Semua rate di atas diambil live dari sheet Pipeline Marketing.</div>
  `;
  document.getElementById('result-a').classList.add('show');
}

function runCalcB(){
  const budget = numRupiah('input-b');
  if(budget<=0){ return; }
  const r = calcB(budget);
  document.getElementById('result-b').innerHTML = `
    <div class="result-hero">
      <div class="lbl">Omzet Potensial</div>
      <div class="val">${fmt(r.omzet)}</div>
      <div class="sub">${fmtNum(r.deal)} Deal · ${fmt(r.budgetHarian)}/hari selama ${RATES.meta.hariAktif} hari</div>
    </div>
    ${funnelStepsHTML(r)}
    <div class="rate-note">CPM (biaya per 1000 Impression): ${fmt(RATES.meta.cpm)}. Semua rate di atas diambil live dari sheet Pipeline Marketing.</div>
  `;
  document.getElementById('result-b').classList.add('show');
}

function runCalcC(){
  const leads = +document.getElementById('input-c').value || 0;
  const tipe = document.getElementById('input-c-tipe').value;
  if(leads<=0){ return; }
  const r = calcC(leads, tipe);
  const r2 = RATES[tipe==='repeat'?'repeat':'database'];
  document.getElementById('result-c').innerHTML = `
    <div class="result-hero">
      <div class="lbl">Omzet Potensial</div>
      <div class="val">${fmt(r.omzet)}</div>
      <div class="sub">${fmtNum(r.deal)} Deal dari ${leads.toLocaleString('id-ID')} leads (${tipe==='repeat'?'Repeat':'Database'})</div>
    </div>
    <div class="funnel-step"><span class="step-lbl">Jumlah Leads</span><span class="step-val">${leads.toLocaleString('id-ID')}</span></div>
    <div class="funnel-step"><span class="step-lbl">Leads Respon</span><span class="step-val">${fmtNum(r.leadsRespon)}</span></div>
    <div class="funnel-step"><span class="step-lbl">Closing Survey</span><span class="step-val">${fmtNum(r.survey)}</span></div>
    <div class="funnel-step"><span class="step-lbl">Closing Deal</span><span class="step-val">${fmtNum(r.deal)}</span></div>
    <div class="rate-note">Rate dipakai: Leads Respon ${(r2.rateLeadsResponLeadsFu*100).toFixed(1)}% dari total leads, Closing Survey ${(r2.rateSurveyLeadsRespon*100).toFixed(1)}% dari yang respon, Closing Deal ${(r2.rateDealSurvey*100).toFixed(1)}% dari Survey.</div>
  `;
  document.getElementById('result-c').classList.add('show');
}

// ══════════════════════════════════════════════════════
// MODE KONTROL AKTUAL — bandingin rate AKTUAL (dari input user) vs
// rate IDEAL (dari sheet Pipeline Marketing). Ambang batas good/warn/
// bad (90%/60% dari ideal) itu ketentuan saya sendiri, bukan dari
// sheet — biar ada acuan jelas, bisa disesuaikan kalau mau beda.
function classifyRatio(ratio){
  if(ratio===null) return '';
  if(ratio>=0.9) return 'good';
  if(ratio>=0.6) return 'warn';
  return 'bad';
}
function badgeText(ratio){
  if(ratio===null) return '—';
  return Math.round(ratio*100)+'% dari ideal';
}

function runCalcD(){
  const impression = +document.getElementById('input-d-impression').value || 0;
  const klikCtr = +document.getElementById('input-d-klikctr').value || 0;
  const lpView = +document.getElementById('input-d-lpview').value || 0;
  const klikCta = +document.getElementById('input-d-klikcta').value || 0;
  const leads = +document.getElementById('input-d-leads').value || 0;
  const survey = +document.getElementById('input-d-survey').value || 0;
  const deal = +document.getElementById('input-d-deal').value || 0;

  const m = RATES.meta;
  const steps = [
    {label:'Impression → Klik/CTR', actual: impression>0?klikCtr/impression:null, ideal: m.rateKlikCtrImpression, aVal:klikCtr, bVal:impression, aLbl:'Klik/CTR', bLbl:'Impression'},
    {label:'Klik/CTR → LP View', actual: klikCtr>0?lpView/klikCtr:null, ideal: m.rateLpViewKlikCtr, aVal:lpView, bVal:klikCtr, aLbl:'LP View', bLbl:'Klik/CTR'},
    {label:'LP View → Klik CTA', actual: lpView>0?klikCta/lpView:null, ideal: m.rateKlikCtaLpView, aVal:klikCta, bVal:lpView, aLbl:'Klik CTA', bLbl:'LP View'},
    {label:'Klik CTA → Leads', actual: klikCta>0?leads/klikCta:null, ideal: m.rateLeadsKlikCta, aVal:leads, bVal:klikCta, aLbl:'Leads', bLbl:'Klik CTA'},
    {label:'Leads → Survey', actual: leads>0?survey/leads:null, ideal: m.rateSurveyLeads, aVal:survey, bVal:leads, aLbl:'Survey', bLbl:'Leads'},
    {label:'Survey → Deal', actual: survey>0?deal/survey:null, ideal: m.rateDealSurvey, aVal:deal, bVal:survey, aLbl:'Deal', bLbl:'Survey'},
  ];

  let worst = null;
  steps.forEach(function(s){
    s.ratio = (s.actual!==null && s.ideal>0) ? s.actual/s.ideal : null;
    s.cls = classifyRatio(s.ratio);
    if(s.ratio!==null && (worst===null || s.ratio<worst.ratio)) worst=s;
  });

  const rowsHTML = steps.map(function(s){
    return `
      <div class="compare-row">
        <div class="compare-hd">
          <span class="compare-lbl">${s.label}</span>
          <span class="compare-badge ${s.cls||'warn'}">${badgeText(s.ratio)}</span>
        </div>
        <div class="compare-nums">Aktual: <b>${(s.actual!==null?pct1(s.actual):'—')}</b> vs Ideal: <b>${pct1(s.ideal)}</b> (${s.bVal.toLocaleString('id-ID')} ${s.bLbl} → ${s.aVal.toLocaleString('id-ID')} ${s.aLbl})</div>
      </div>
    `;
  }).join('');

  const leakHTML = worst ? `
    <div class="leak-box">
      <div class="leak-title">⚠️ Paling Bocor: ${worst.label}</div>
      <div class="leak-body">Aktual cuma ${badgeText(worst.ratio)} dibanding rate ideal (${pct1(worst.ideal)}). Ini tahap yang paling butuh perbaikan duluan — gak ada gunanya nambah budget atas (Impression) kalau bocornya di sini.</div>
    </div>
  ` : '';

  document.getElementById('result-d').innerHTML = rowsHTML + leakHTML;
  document.getElementById('result-d').classList.add('show');
}
