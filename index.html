<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F7FC;--card:#FFFFFF;--card2:#F3F1FF;--bdr:#ECEAF8;
  --txt:#161A2B;--txt2:#484D64;--mut:#8B8FA3;
  --pri:#6366F1;--pri2:#8B5CF6;--pri-d:#4F46E5;--pri-l:#EEF0FF;
  --grn:#10B981;--grn-l:#ECFDF5;
  --amb:#F59E0B;--amb-l:#FFFBEB;
  --red:#F43F5E;--red-l:#FFF1F3;
  --shd:0 4px 20px rgba(99,102,241,.08);
  --shd-lg:0 8px 28px rgba(99,102,241,.14);
  --font:'Poppins',-apple-system,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
input,select,button{font-family:var(--font)}

.topbar{background:linear-gradient(120deg,var(--pri),var(--pri2));padding:20px 18px 22px;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(99,102,241,.25)}
.tb-title{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.01em}
.tb-sub{font-size:10.5px;color:rgba(255,255,255,.8);margin-top:2px;font-weight:500}

.wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px}

.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:18px;background:var(--card);padding:6px;border-radius:18px;box-shadow:var(--shd)}
.tab-btn{padding:10px 4px;border-radius:12px;background:transparent;border:none;font-size:9.5px;font-weight:700;color:var(--mut);text-align:center;cursor:pointer;line-height:1.35;transition:all .2s}
.tab-btn.active{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.35)}

.tab-panel{display:none}
.tab-panel.active{display:block}

.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--shd);border:1px solid var(--bdr);margin-bottom:14px}
.card-title{font-size:14px;font-weight:800;color:var(--txt);margin-bottom:5px;letter-spacing:-.01em}
.card-desc{font-size:11px;color:var(--mut);margin-bottom:18px;line-height:1.65}

.form-row{margin-bottom:15px}
.form-row label{display:block;font-size:11.5px;font-weight:700;color:var(--txt2);margin-bottom:7px}
.form-row input,.form-row select{width:100%;padding:13px 15px;border:1.5px solid var(--bdr);border-radius:13px;font-size:14px;color:var(--txt);background:var(--bg);outline:none;transition:border-color .2s}
.form-row input:focus,.form-row select:focus{border-color:var(--pri);background:#fff}

.btn{padding:15px 20px;border-radius:14px;border:none;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;width:100%;transition:transform .15s}
.btn-primary{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.3)}

.result-box{background:var(--card2);border-radius:18px;padding:18px;margin-top:18px;display:none}
.result-box.show{display:block}
.result-hero{text-align:center;padding:18px 16px 22px;border-radius:16px;margin-bottom:16px;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 8px 20px rgba(99,102,241,.25)}
.result-hero .lbl{font-size:10.5px;color:rgba(255,255,255,.8);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.result-hero .val{font-size:27px;font-weight:800;color:#fff;margin-top:5px;letter-spacing:-.01em}
.result-hero .sub{font-size:11px;color:rgba(255,255,255,.85);margin-top:5px;font-weight:500}

.funnel-step{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--card);border-radius:12px;margin-bottom:7px}

.funnel-step .step-val{font-size:13px;color:var(--pri-d);font-weight:800}

.rate-note{font-size:9.5px;color:var(--mut);margin-top:12px;line-height:1.65;background:var(--card);border-radius:12px;padding:11px 13px}

.compare-row{padding:12px 14px;background:var(--card);border-radius:14px;margin-bottom:8px}
.compare-row:last-child{margin-bottom:0}
.compare-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.compare-lbl{font-size:11.5px;font-weight:700;color:var(--txt2)}
.compare-badge{font-size:9px;font-weight:800;padding:3px 9px;border-radius:20px}

.compare-badge.warn{background:var(--amb-l);color:var(--amb)}

.advisor-section{margin-top:16px}
.advisor-section-title{font-size:13px;font-weight:800;color:var(--txt);margin-bottom:3px}
.advisor-section-sub{font-size:10.5px;color:var(--mut);margin-bottom:12px;line-height:1.6}

.leak-box{background:linear-gradient(135deg,var(--red),#FB7185);border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 6px 16px rgba(244,63,94,.25)}
.leak-box.good{background:linear-gradient(135deg,var(--grn),#34D399);box-shadow:0 6px 16px rgba(16,185,129,.25)}
.leak-box .leak-title{font-size:12.5px;font-weight:800;color:#fff;margin-bottom:4px}
.leak-box .leak-kategori{font-size:10px;font-weight:700;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}

.leak-box .leak-actions{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.25)}
.leak-box .leak-action-item{font-size:10.5px;color:#fff;line-height:1.8;font-weight:500}

.sum-indicator{font-size:11px;font-weight:700;text-align:center;padding:10px;border-radius:12px;background:var(--bg);color:var(--mut)}
.sum-indicator.good{background:var(--grn-l);color:var(--grn)}
.sum-indicator.warn{background:var(--amb-l);color:var(--amb)}

.target-ideal-box{background:linear-gradient(135deg,var(--pri),var(--pri2));border-radius:16px;padding:14px 16px;margin-bottom:16px;box-shadow:0 6px 16px rgba(99,102,241,.25)}

.target-ideal-val{font-size:20px;font-weight:800;color:#fff;margin-top:4px}
.target-ideal-sub{font-size:10.5px;color:rgba(255,255,255,.85);margin-top:3px}
.btn-mini{margin-top:10px;padding:8px 14px;border-radius:10px;border:none;background:rgba(255,255,255,.2);color:#fff;font-family:var(--font);font-size:10.5px;font-weight:700;cursor:pointer}

.score-hero{text-align:center;padding:20px 16px 24px;border-radius:18px;margin-bottom:16px;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 8px 20px rgba(99,102,241,.25)}
.score-hero .lbl{font-size:10.5px;color:rgba(255,255,255,.8);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.score-hero .val{font-size:40px;font-weight:800;color:#fff;margin-top:4px;line-height:1}
.score-hero .val span{font-size:16px;font-weight:600;color:rgba(255,255,255,.75)}
.score-hero .sub{font-size:11px;color:rgba(255,255,255,.9);margin-top:6px}

.score-item{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--card);border-radius:12px;margin-bottom:7px}
.score-item:last-child{margin-bottom:0}
.score-item-lbl{font-size:11.5px;color:var(--txt2);font-weight:600}
.score-item-raw{font-size:9.5px;color:var(--mut);display:block;margin-top:1px}
.score-item-badge{font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px}
.score-item-badge.s100{background:var(--grn-l);color:var(--grn)}
.score-item-badge.s75{background:#DCFCE7;color:#15803D}
.score-item-badge.s40{background:var(--amb-l);color:var(--amb)}
.score-item-badge.s10{background:var(--red-l);color:var(--red)}

.score-section-lbl{font-size:10px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;margin:14px 0 8px}
.score-section-lbl:first-of-type{margin-top:0}
.pass-badge{font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px}
.pass-badge.pass{background:var(--grn-l);color:var(--grn)}
.pass-badge.fail{background:var(--red-l);color:var(--red)}

.sample-warning{background:var(--amb-l);border:1.5px solid #FDE68A;border-radius:12px;padding:11px 13px;margin-bottom:14px;font-size:10.5px;color:#92400E;line-height:1.6;font-weight:600}
.sample-badge{display:inline-block;font-size:8.5px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--amb-l);color:var(--amb);vertical-align:middle}

.leaderboard-title{font-size:13px;font-weight:800;color:var(--txt);margin:18px 0 10px}
.leaderboard-row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);border-radius:14px;margin-bottom:8px;box-shadow:var(--shd);border:1px solid var(--bdr);cursor:pointer}
.leaderboard-rank{font-size:16px;font-weight:800;color:var(--mut);width:26px;flex-shrink:0;text-align:center}
.leaderboard-rank.top{color:var(--pri)}
.leaderboard-info{flex:1;min-width:0}
.leaderboard-name{font-size:12px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaderboard-meta{font-size:9.5px;color:var(--mut);margin-top:2px}
.leaderboard-score{font-size:18px;font-weight:800;color:var(--pri-d);flex-shrink:0}
.leaderboard-del{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:4px 6px;flex-shrink:0}
.empty-leaderboard{text-align:center;padding:24px 16px;color:var(--mut);font-size:11px;background:var(--bg);border-radius:14px}

.tipe-toggle{display:flex;gap:8px}
.tipe-toggle-btn{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--bdr);background:var(--bg);color:var(--mut);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;text-align:center}
.tipe-toggle-btn.active{background:linear-gradient(120deg,var(--pri),var(--pri2));border-color:transparent;color:#fff}

.loading{text-align:center;padding:50px 20px;color:var(--mut);font-size:12px}
.err-box{text-align:center;padding:30px 20px;color:var(--red);font-size:11.5px;line-height:1.6;background:var(--red-l);border-radius:16px;margin:0 4px}
</style>

<body>

<header class="topbar">
  <div class="tb-title">🧮 Kalkulator Funnel & Budget</div>
  <div class="tb-sub">Berdasarkan Pipeline Marketing — rate live dari sheet</div>
</header>

<div class="wrap">
  <div id="content">
    <div class="loading">⏳ Mengambil rate konversi dari sheet...</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// SUMBER DATA — Pipeline Marketing sheet
// ══════════════════════════════════════════════════════
const SHEET_ID = '1yVP3lGxCx88FDI5fgXQHdXF1G0gWldsSs7fT7RKDNPg';
const GID = 0;

function fmt(n){ return 'Rp ' + Math.round(n||0).toLocaleString('id-ID'); }
function fmtNum(n){ return Math.round(n||0).toLocaleString('id-ID'); }
function parseNumStr(s){
  if(typeof s==='number') return s;
  var clean=String(s||'').replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(',','.');
  return parseFloat(clean)||0;
}

function gviz(){
  var url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?gid='+GID+'&tqx=out:json&range=A1:P12';
  return fetch(url).then(function(r){return r.text();}).then(function(txt){
    var json=JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}')+1));
    return json.table;
  });
}

function parseTable(table){
  var rows=table.rows.map(function(row){
    return (row.c||[]).map(function(cell){
      return cell && cell.v!==null && cell.v!==undefined ? cell.v : '';
    });
  });
  return rows;
}

// ══════════════════════════════════════════════════════
// TURUNIN RATE DARI ANGKA MENTAH (bukan dari teks label) —
// biar gak kesandung typo label kayak sebelumnya. Posisi kolom:
// A=Channel,B=HariAktif,C=OmzetPerusahaan,D=%,E=OmzetChannel,
// F=RataNilaiProyek,G=ClosingDeal,H=ClosingSurvey,I=LeadsMasuk/Respon,
// J=KlikCTA/LeadsFU,K=LPView/FUPerHari,L=Klik-CTR,M=Impression,
// N=CPM,O=Budget,P=BudgetHarian
// ══════════════════════════════════════════════════════
var RATES = null;

function findRowByChannel(rows, keyword){
  // GViz suka "loncatin" baris kosong, jadi index array BUKAN patokan
  // yang bisa dipercaya buat nomor baris di sheet aslinya (udah
  // berkali-kali kejadian di app lain). Jadi dicari dari ISI kolom A
  // (nama channel), bukan posisi tetap.
  for(var i=0;i<rows.length;i++){
    var label = String(rows[i][0]||'').toLowerCase().trim();
    if(label.includes(keyword)) return rows[i];
  }
  return null;
}

function deriveRates(rows){
  function col(row,i){ return row ? parseNumStr(row[i]) : 0; }

  var metaRow = findRowByChannel(rows, 'meta ads');
  var dbRow = findRowByChannel(rows, 'follow up database');
  var repRow = findRowByChannel(rows, 'repeat');
  var bulanIniRow = findRowByChannel(rows, 'bulan ini');

  console.log('[Pipeline Marketing] Baris ditemukan — Meta Ads:', metaRow, '| FU Database:', dbRow, '| Repeat:', repRow, '| FU Bulan Ini:', bulanIniRow);

  if(!metaRow || !dbRow || !repRow || !bulanIniRow){
    throw new Error('Gak nemu baris channel yang dicari di sheet (Meta Ads/Follow Up Database/Repeat/Bulan ini). Cek apakah nama channel di kolom A masih sama persis.');
  }

  var meta = {
    hariAktif: col(metaRow,1),
    rataNilaiProyek: col(metaRow,5),
    rateDealSurvey: col(metaRow,6)/col(metaRow,7),       // G/H
    rateSurveyLeads: col(metaRow,7)/col(metaRow,8),      // H/I
    rateLeadsKlikCta: col(metaRow,8)/col(metaRow,9),     // I/J
    rateKlikCtaLpView: col(metaRow,9)/col(metaRow,10),   // J/K
    rateLpViewKlikCtr: col(metaRow,10)/col(metaRow,11),  // K/L
    rateKlikCtrImpression: col(metaRow,11)/col(metaRow,12), // L/M
    cpm: col(metaRow,13),
  };

  function parseFU(row){
    return {
      hariAktif: col(row,1),
      rataNilaiProyek: col(row,5),
      rateDealSurvey: col(row,6)/col(row,7),      // G/H
      rateSurveyLeadsRespon: col(row,7)/col(row,8), // H/I
      rateLeadsResponLeadsFu: col(row,8)/col(row,9), // I/J
    };
  }

  return {
    meta: meta,
    database: parseFU(dbRow),
    repeat: parseFU(repRow),
    bulanIni: parseFU(bulanIniRow),
  };
}

// ══════════════════════════════════════════════════════
// KALKULATOR A — Omzet Target → Budget (mundur dari Deal ke Impression)
// ══════════════════════════════════════════════════════
function calcA(omzetTarget){
  var m = RATES.meta;
  var deal = omzetTarget / m.rataNilaiProyek;
  var survey = deal / m.rateDealSurvey;
  var leads = survey / m.rateSurveyLeads;
  var klikCta = leads / m.rateLeadsKlikCta;
  var lpView = klikCta / m.rateKlikCtaLpView;
  var klikCtr = lpView / m.rateLpViewKlikCtr;
  var impression = klikCtr / m.rateKlikCtrImpression;
  var budgetTotal = impression * m.cpm / 1000;
  var budgetHarian = budgetTotal / m.hariAktif;
  return {deal,survey,leads,klikCta,lpView,klikCtr,impression,budgetTotal,budgetHarian};
}

// ══════════════════════════════════════════════════════
// KALKULATOR B — Budget Total → Omzet Potensial (maju dari Impression ke Deal)
// ══════════════════════════════════════════════════════
function calcB(budgetTotal){
  var m = RATES.meta;
  var impression = budgetTotal / m.cpm * 1000;
  var klikCtr = impression * m.rateKlikCtrImpression;
  var lpView = klikCtr * m.rateLpViewKlikCtr;
  var klikCta = lpView * m.rateKlikCtaLpView;
  var leads = klikCta * m.rateLeadsKlikCta;
  var survey = leads * m.rateSurveyLeads;
  var deal = survey * m.rateDealSurvey;
  var omzet = deal * m.rataNilaiProyek;
  var budgetHarian = budgetTotal / m.hariAktif;
  return {impression,klikCtr,lpView,klikCta,leads,survey,deal,omzet,budgetHarian};
}

// ══════════════════════════════════════════════════════
// KALKULATOR C — Jumlah Leads (Database/Repeat) → Omzet Potensial
// ══════════════════════════════════════════════════════
function rateForTipe(tipe){
  if(tipe==='repeat') return RATES.repeat;
  if(tipe==='bulanini') return RATES.bulanIni;
  return RATES.database;
}
function tipeLabel(tipe){
  if(tipe==='repeat') return 'Repeat Customer';
  if(tipe==='bulanini') return 'Follow Up Bulan Ini';
  return 'Follow Up Database';
}

function calcC(jumlahLeads, tipe){
  var r = rateForTipe(tipe);
  var leadsRespon = jumlahLeads * r.rateLeadsResponLeadsFu;
  var survey = leadsRespon * r.rateSurveyLeadsRespon;
  var deal = survey * r.rateDealSurvey;
  var omzet = deal * r.rataNilaiProyek;
  return {leadsRespon,survey,deal,omzet};
}

// ══════════════════════════════════════════════════════
// RENDER UI
// ══════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════
// TARGET ALOKASI — disimpen di localStorage, dipakai Tab A & Tab C
// buat nunjukin "Target Ideal" otomatis.
// ══════════════════════════════════════════════════════
function updateTargetPreview(){
  const pMeta = +document.getElementById('input-target-meta').value || 0;
  const pDb = +document.getElementById('input-target-database').value || 0;
  const pRep = +document.getElementById('input-target-repeat').value || 0;
  const pBulan = +document.getElementById('input-target-bulanini').value || 0;
  const total = pMeta+pDb+pRep+pBulan;
  const el = document.getElementById('target-sum-indicator');
  el.textContent = 'Total: '+total+'%'+(total===100?' ✅ pas':total>100?' ⚠️ kelebihan '+(total-100)+'%':' ⚠️ kurang '+(100-total)+'%');
  el.className = 'sum-indicator '+(total===100?'good':'warn');
}

function getTargetAlokasi(){
  try{
    const raw = localStorage.getItem('funnelcalc_target_alokasi');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function saveTargetAlokasi(){
  const omzet = numRupiah('input-target-omzet');
  const pMeta = +document.getElementById('input-target-meta').value || 0;
  const pDb = +document.getElementById('input-target-database').value || 0;
  const pRep = +document.getElementById('input-target-repeat').value || 0;
  const pBulan = +document.getElementById('input-target-bulanini').value || 0;
  const total = pMeta+pDb+pRep+pBulan;

  if(omzet<=0){
    document.getElementById('result-target').innerHTML = '<div class="err-box">Isi Target Omzet Perusahaan dulu.</div>';
    document.getElementById('result-target').classList.add('show');
    return;
  }
  if(total!==100){
    document.getElementById('result-target').innerHTML = '<div class="err-box">Total persentase harus PAS 100% (sekarang '+total+'%). Sesuaikan dulu sebelum disimpan.</div>';
    document.getElementById('result-target').classList.add('show');
    return;
  }

  const alokasi = {omzet,pMeta,pDb,pRep,pBulan};
  localStorage.setItem('funnelcalc_target_alokasi', JSON.stringify(alokasi));
  renderTargetResult(alokasi);
  renderTargetIdealBadgeA();
  renderTargetIdealBadgeC();
}

function renderTargetResult(alokasi){
  const omzetMeta = alokasi.omzet*alokasi.pMeta/100;
  const omzetDb = alokasi.omzet*alokasi.pDb/100;
  const omzetRep = alokasi.omzet*alokasi.pRep/100;
  const omzetBulan = alokasi.omzet*alokasi.pBulan/100;
  document.getElementById('result-target').innerHTML = `
    <div class="result-hero">
      <div class="lbl">✅ Tersimpan</div>
      <div class="val">${fmt(alokasi.omzet)}</div>
      <div class="sub">Total Target Omzet Perusahaan</div>
    </div>
    <div class="funnel-step"><span class="step-lbl">Meta Ads (${alokasi.pMeta}%)</span><span class="step-val">${fmt(omzetMeta)}</span></div>

function switchTab(tab){

function formatRupiah(el){
  const raw=el.value.replace(/\D/g,'');
  el.value=raw?Number(raw).toLocaleString('id-ID'):'';
}
function numRupiah(id){
  const raw=document.getElementById(id).value.replace(/\D/g,'');
  return raw?+raw:0;
}

function pct1(r){ return (r*100).toFixed(1)+'%'; }

// MODE KONTROL AKTUAL — bandingin rate AKTUAL (dari input user) vs
// rate IDEAL (dari sheet Pipeline Marketing). Ambang batas good/warn/
// bad (90%/60% dari ideal) itu ketentuan saya sendiri, bukan dari
// sheet — biar ada acuan jelas, bisa disesuaikan kalau mau beda.
function classifyRatio(ratio){
  if(ratio===null) return '';
  if(ratio>=0.9) return 'good';
  if(ratio>=0.6) return 'warn';
  return 'bad';
}
function badgeText(ratio){
  if(ratio===null) return '—';
  return Math.round(ratio*100)+'% dari ideal';
}

// SKOR ADS CREATIVE — rentang skor berdasarkan patokan user sendiri
// (CPM, CTR, Frekuensi), Hook Rate pakai standar industri SEMENTARA
// (belum ada patokan dari user, bisa dikalibrasi ulang nanti).
// ══════════════════════════════════════════════════════
let CREATIVE_TIPE = 'video';

function setCreativeTipe(tipe){
  CREATIVE_TIPE = tipe;
  document.getElementById('btn-tipe-video').classList.toggle('active', tipe==='video');
  document.getElementById('btn-tipe-image').classList.toggle('active', tipe==='image');
  document.getElementById('row-f-hookrate').style.display = tipe==='video' ? 'block' : 'none';
}

// ── LAPISAN 1: Pass/Fail terhadap KPI TETAP (patokan user) — jawab
// "apakah creative ini LAYAK", bukan "siapa paling jago".
function passCPM(v){ return v<50000; }
function passCTR(v){ return v>=1; }
function passFrekuensi(v){ return v<=2; }

// ── LAPISAN 2: Skor RELATIF 0-100 di antara SEMUA creative yang
// tersimpan (termasuk yang baru) — ini yang jawab "siapa paling jago".
// Nilai PALING BAGUS di kumpulan itu dapet ~100, PALING JELEK dapet
// ~0, sisanya proporsional. Kalau cuma 1 data atau semua nilainya
// sama, otomatis 100 (gak ada basis buat dibedain).
function relativeScore(value, allValues, lowerIsBetter){
  const min = Math.min.apply(null, allValues);
  const max = Math.max.apply(null, allValues);
  if(max===min) return 100;
  const raw = lowerIsBetter ? (max-value)/(max-min) : (value-min)/(max-min);
  return +(raw*100).toFixed(1);
}
function scoreLabel(s){ if(s>=80) return 'Terbaik'; if(s>=50) return 'Menengah'; if(s>=20) return 'Lemah'; return 'Terlemah'; }
function scoreCls(s){ if(s>=80) return 's100'; if(s>=50) return 's75'; if(s>=20) return 's40'; return 's10'; }

// Hitung ulang skor RELATIF buat SEMUA creative di list sekaligus
// (posisi tiap creative bisa geser tiap kali ada data baru/dihapus).
function computeAllScores(list){
  if(!list.length) return [];
  const cpmVals = list.map(function(c){return c.cpm;});
  const ctrVals = list.map(function(c){return c.ctr;});
  const freqVals = list.map(function(c){return c.frekuensi;});
  const videoWithHook = list.filter(function(c){return c.tipe==='video' && c.hookRate!=null;});
  const hookVals = videoWithHook.map(function(c){return c.hookRate;});

  return list.map(function(c){
    const items = [
      {key:'cpm', label:'CPM', raw:fmt(c.cpm), score:relativeScore(c.cpm, cpmVals, true), pass:passCPM(c.cpm)},
      {key:'ctr', label:'CTR', raw:c.ctr+'%', score:relativeScore(c.ctr, ctrVals, false), pass:passCTR(c.ctr)},
      {key:'frekuensi', label:'Frekuensi', raw:c.frekuensi+'x', score:relativeScore(c.frekuensi, freqVals, true), pass:passFrekuensi(c.frekuensi)},
    ];
    if(c.tipe==='video' && c.hookRate!=null){
      items.push({key:'hookRate', label:'Hook Rate / ThruPlay', raw:c.hookRate+'%', score: hookVals.length>1?relativeScore(c.hookRate, hookVals, false):100, pass:null});
    }
    const composite = +(items.reduce(function(s,it){return s+it.score;},0)/items.length).toFixed(1);
    const out = {}; for(var k in c) out[k]=c[k];
    out.scoreItems = items; out.composite = composite;
    return out;
  });
}

// Winner Result (tertinggi) & CPR (terendah) — ini metrik GOAL AKHIR,
// gak masuk skor komposit, ditampilin head-to-head apa adanya.
// Impression di bawah 1.000 = sample kecil, skornya bisa jadi "noise"
// (kebetulan), bukan beneran mencerminkan performa creative.
function isSampleKecil(c){
  return c.impression!=null && c.impression<1000;
}

function computeWinners(list){
  const withResult = list.filter(function(c){return c.result!=null && c.result>0;});
  const withCpr = list.filter(function(c){return c.cpr!=null && c.cpr>0;});
  let resultWinnerId = null, cprWinnerId = null;
  if(withResult.length){
    resultWinnerId = withResult.reduce(function(a,b){return b.result>a.result?b:a;}).id;
  }
  if(withCpr.length){
    cprWinnerId = withCpr.reduce(function(a,b){return b.cpr<a.cpr?b:a;}).id;
  }
  return {resultWinnerId, cprWinnerId};
}

function getCreatives(){
  try{
    const raw = localStorage.getItem('funnelcalc_creatives');
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveCreativesToStorage(list){
  localStorage.setItem('funnelcalc_creatives', JSON.stringify(list));
}

function runCalcF(){
  const nama = document.getElementById('input-f-nama').value.trim();
  const impression = numRupiah('input-f-impression') || null;
  const reach = numRupiah('input-f-reach') || null;
  const cpm = numRupiah('input-f-cpm');
  const ctr = +document.getElementById('input-f-ctr').value || 0;
  const frekuensi = +document.getElementById('input-f-frekuensi').value || 0;
  const hookRateVal = document.getElementById('input-f-hookrate').value;
  const hookRate = (CREATIVE_TIPE==='video' && hookRateVal!=='') ? +hookRateVal : null;
  const result = numRupiah('input-f-result') || null;
  const cpr = numRupiah('input-f-cpr') || null;

  if(!nama){ document.getElementById('result-f').innerHTML='<div class="err-box">Isi Nama Creative dulu.</div>'; document.getElementById('result-f').classList.add('show'); return; }
  if(cpm<=0 || ctr<=0){ document.getElementById('result-f').innerHTML='<div class="err-box">Isi CPM dan CTR dulu.</div>'; document.getElementById('result-f').classList.add('show'); return; }

  const data = {id:Date.now(), nama, tipe:CREATIVE_TIPE, impression, reach, cpm, ctr, frekuensi, hookRate, result, cpr};
  const list = getCreatives();
  list.push(data);
  saveCreativesToStorage(list);

  const scored = computeAllScores(list);
  const justSaved = scored.find(function(c){return c.id===data.id;});
  renderScoreResult(justSaved, list);
  renderLeaderboard();
}

function renderScoreResult(scoredData, fullList){

  document.getElementById('result-f').innerHTML = `
    <div class="score-hero">
      <div class="lbl">${esc(scoredData.nama)}</div>
      <div class="val">${scoredData.composite}<span>/100</span></div>
      <div class="sub">${scoredData.tipe==='video'?'🎬 Video':'🖼️ Image'} · Skor RELATIF (dibanding ${fullList.length} creative tersimpan)</div>
    </div>
    ${isSampleKecil(scoredData) ? `<div class="sample-warning">⚠️ Sample Kecil — Impression cuma ${scoredData.impression.toLocaleString('id-ID')} (di bawah 1.000). Skor di bawah ini bisa jadi belum representatif, hati-hati ambil kesimpulan.</div>` : ''}
    ${(scoredData.impression!=null || scoredData.reach!=null) ? `
    <div class="score-section-lbl">Data Pendukung</div>
    ${scoredData.impression!=null?`<div class="score-item"><span class="score-item-lbl">Impression</span><span class="score-item-raw" style="display:inline;margin-left:8px">${scoredData.impression.toLocaleString('id-ID')}</span></div>`:''}
    ${scoredData.reach!=null?`<div class="score-item"><span class="score-item-lbl">Reach</span><span class="score-item-raw" style="display:inline;margin-left:8px">${scoredData.reach.toLocaleString('id-ID')}</span></div>`:''}
    `:''}
    <div class="score-section-lbl">Lapisan 1 — Lolos KPI Tetap?</div>
    ${scoredData.scoreItems.filter(function(it){return it.pass!==null;}).map(function(it){
      return `<div class="score-item">
        <div><span class="score-item-lbl">${it.label}</span><span class="score-item-raw">${it.raw}</span></div>
        <span class="pass-badge ${it.pass?'pass':'fail'}">${it.pass?'✅ Lolos':'❌ Gak Lolos'}</span>
      </div>`;
    }).join('')}
    <div class="score-section-lbl">Lapisan 2 — Skor Relatif per Indikator</div>
    ${scoredData.scoreItems.map(function(it){
      return `<div class="score-item">
        <div><span class="score-item-lbl">${it.label}</span><span class="score-item-raw">${it.raw}</span></div>
        <span class="score-item-badge ${scoreCls(it.score)}">${it.score} · ${scoreLabel(it.score)}</span>
      </div>`;
    }).join('')}
    ${(scoredData.result!=null || scoredData.cpr!=null) ? `
    <div class="score-section-lbl">Goal Akhir — Apa Adanya (Head-to-Head)</div>
    ${scoredData.result!=null?`<div class="score-item"><span class="score-item-lbl">Result</span><span class="score-item-badge ${winners.resultWinnerId===scoredData.id?'s100':'s75'}">${scoredData.result.toLocaleString('id-ID')}${winners.resultWinnerId===scoredData.id?' 🏆':''}</span></div>`:''}
    ${scoredData.cpr!=null?`<div class="score-item"><span class="score-item-lbl">CPR</span><span class="score-item-badge ${winners.cprWinnerId===scoredData.id?'s100':'s75'}">${fmt(scoredData.cpr)}${winners.cprWinnerId===scoredData.id?' 🏆':''}</span></div>`:''}
    `:''}
    <div class="rate-note">Skor relatif ikut berubah tiap ada creative baru/dihapus — ini NORMAL, karena tujuannya bandingin, bukan patokan tetap. Result & CPR gak masuk skor, murni head-to-head.</div>
  `;
  document.getElementById('result-f').classList.add('show');
}

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function renderLeaderboard(){
  const rawList = getCreatives();
  const scored = computeAllScores(rawList).sort(function(a,b){ return b.composite-a.composite; });
  const winners = computeWinners(rawList);
  const el = document.getElementById('leaderboard-f');
  if(!scored.length){
    el.innerHTML = '<div class="empty-leaderboard">Belum ada creative yang disimpan. Hitung skor di atas buat mulai ngisi leaderboard.</div>';
    return;
  }
  el.innerHTML = scored.map(function(c,i){
    const resultTxt = c.result!=null ? c.result.toLocaleString('id-ID')+(winners.resultWinnerId===c.id?' 🏆':'') : '—';
    const cprTxt = c.cpr!=null ? fmt(c.cpr)+(winners.cprWinnerId===c.id?' 🏆':'') : '—';
    return `
      <div class="leaderboard-row" onclick="viewCreativeDetail(${c.id})">
        <div class="leaderboard-rank ${i===0?'top':''}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)}</div>
        <div class="leaderboard-info">
          <div class="leaderboard-name">${esc(c.nama)}${isSampleKecil(c)?' <span class="sample-badge">⚠️ Sample Kecil</span>':''}</div>
          <div class="leaderboard-meta">${c.tipe==='video'?'🎬':'🖼️'} Result: ${resultTxt} · CPR: ${cprTxt}</div>
        </div>
        <div class="leaderboard-score">${c.composite}</div>
        <button class="leaderboard-del" onclick="event.stopPropagation();deleteCreative(${c.id})">✕</button>
      </div>
    `;
  }).join('');
}

function viewCreativeDetail(id){
  const list = getCreatives();
  const scored = computeAllScores(list);
  const data = scored.find(function(c){ return c.id===id; });
  if(!data) return;
  renderScoreResult(data, list);
  document.getElementById('result-f').scrollIntoView({behavior:'smooth',block:'start'});
}

function deleteCreative(id){
  const list = getCreatives().filter(function(c){ return c.id!==id; });
  saveCreativesToStorage(list);
  renderLeaderboard();
}
